name: Build Ran

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Optional: your own Play upload key (Settings → Secrets → Actions).
      # Without it the bundled development key is used, which is fine for testing.
      - name: Install release keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/ran.keystore

      - name: Build APK (for direct install / testing)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build AAB (for Google Play)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Collect files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Ran.apk
          cp app/build/outputs/bundle/release/app-release.aab Ran-play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Ran
          path: |
            Ran.apk
            Ran-play.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Ran 1.0 (build ${{ github.run_number }})
          files: |
            Ran.apk
            Ran-play.aab
          make_latest: true
